.fadein { animation: fadein .9s ease both; } .draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 1.8s cubic-bezier(.6,0,.2,1) .3s forwards; }
.breathe { animation: breathe 8s ease-in-out infinite; }
@keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes draw { to { stroke-dashoffset: 0; } } @keyframes breathe { 0%,100% { opacity: .7; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .fadein,.breathe { animation: none; } .draw { animation: none; stroke-dashoffset: 0; } }
